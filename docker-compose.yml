services:
  db:
    image: postgres:17-alpine
    container_name: slotly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slotly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slotly}
      POSTGRES_DB: ${POSTGRES_DB:-slotly}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensiones.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
